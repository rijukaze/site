        const text = `Ekstrak seluruh informasi dari dokumen CV ini dalam bahasa inggris dan sajikan dalam format JSON yang sangat terstruktur dengan ketentuan sebagai berikut:

dataDiri: Buat objek dengan key nama, posisi, alamat, hp, email, linkedin, dan summary (ringkasan profesional).

pendidikan: Buat objek dengan index string ("0", "1", "2", dst). Setiap index berisi key sekolah, jurusan, nilai (format angka seperti 37.8), dan periode.

pelatihan: Buat objek dengan index string ("0", "1", "2", dst). 
Setiap index berisi key instansi, program, dan periode.

sertifikat: Buat objek dengan index string ("0", "1", "2", dst). 
Setiap index berisi key program, no, dan periode.

skill: Buat objek dengan key "bahasa", 
"hard" (daftar hard skill dipisah koma), 
dan "soft" (daftar soft skill dipisah koma).

pengalaman: Buat objek dengan index string ("0", "1", "2", dst). Setiap index berisi:
perusahaan, posisi, periode, tools.

        navigator.clipboard.writeText(text)
            .then(() => {
                alert("Prompt berhasil di-copy!");
            })

            });

    function submitPrompt() {
        try {

            var text = $("#json").val();
            const parseJson = JSON.parse(text);
            dataDiri = parseJson.dataDiri;
            pendidikan = parseJson.pendidikan;
            pelatihan = parseJson.pelatihan;
            sertifikat = parseJson.sertifikat;
            skill = parseJson.skill;
            pengalaman = parseJson.pengalaman;
            juara = parseJson.juara;

            console.log(dataDiri);
            console.log(pendidikan);
            console.log(pelatihan);
            console.log(sertifikat);
            console.log(skill);
            console.log(pengalaman);
            console.log(juara);

            convertCV(dataDiri, pendidikan, pelatihan, sertifikat, skill, pengalaman, juara);

        } catch (error) {

    function convertCV(dataDiri, pendidikan, pelatihan, sertifikat, skill, pengalaman, juara) {

        $("#nama").val(dataDiri.nama.toUpperCase());
        $("#posisi").val(dataDiri.posisi);
        $("#hp").val(dataDiri.hp);
        $("#email").val(dataDiri.email);
        $("#linkedin").val(dataDiri.linkedin);
        $("#alamat").val(dataDiri.alamat);
        $("#summary").val(dataDiri.summary);

        var pendidikanHtml = "";
        for (var i in pendidikan) {
            if (pendidikan[i].sekolah) {
                pendidikanHtml += ''
                    + '  <div class="w-full flex">'
                    + '    <div class="font-bold"><textarea rows="1" class="sub-title font-bold break-words border-0 overflow-hidden resize-none auto-height" style="line-height: 1.2;width:270px" oninput="this.style.height=`auto`; this.style.height=this.scrollHeight+`px`;">' + pendidikan[i].sekolah + '</textarea></div>'
                    + '    <div class="ms-auto font-bold"><input type="text" class="no-border auto-width" value="' + pendidikan[i].periode + '"></div>'
                    + '  </div>'
                    + '  <div class="w-full flex mb-2" style="margin-top:-8px">'
                    + '    <div class="me-2"><input type="text" class="no-border auto-width" value="' + pendidikan[i].jurusan + '"></div>|'
                    + '    <div class="ms-2">GPA: <input type="text" class="no-border auto-width" value="' + pendidikan[i].nilai + '"></div>'
                    + '  </div>';
            }
        }
        $("#pendidikan").html(pendidikanHtml);

        var pengalamanHtml = "";
        var currCompany = "";
        for (var i in pengalaman) {
            if (pengalaman[i].perusahaan) {

                if (currCompany != pengalaman[i].perusahaan) {
                    pengalamanHtml += ''
                        + '  <div class="w-full flex font-bold">'
                        + '    <div><input type="text" class="no-border auto-width" value="' + pengalaman[i].perusahaan + '"></div>'
                        + '    <div class="ms-auto"><input type="text" class="no-border auto-width" value="' + pengalaman[i].periode + '"></div>'
                        + '  </div>'
                        + '  <div class="me-2"><input type="text" class="no-border auto-width" value="' + pengalaman[i].posisi + '"></div>';
                } else {
                    pengalamanHtml += ''
                        + '  <div class="w-full flex">'
                        + '    <div><input type="text" class="no-border auto-width" value="' + pengalaman[i].posisi + '"></div>'
                        + '    <div class="ms-auto font-bold"><input type="text" class="no-border auto-width" value="' + pengalaman[i].periode + '"></div>'
                        + '  </div>';
                }
                currCompany = pengalaman[i].perusahaan;

                pengalamanHtml += ''
                    + '  <div><ul class="list-disc pl-5">';
                for (var j in pengalaman[i].deskripsi) {
                    if (pengalaman[i].deskripsi[j]) {
                        pengalamanHtml += `  <li><textarea rows="1" class="text-justify w-full resize-none overflow-hidden border-0 p-0  align-top auto-height" oninput="this.style.height='auto'; this.style.height=this.scrollHeight+'px';">` + pengalaman[i].deskripsi[j] + `</textarea></li>`;
                    }
                }
                pengalamanHtml += ''
                    + '  </ul></div><div class="mb-2"><b>Tools:</b> <textarea rows="1" class="break-words border-0 overflow-hidden resize-none auto-height w-full" style="line-height: 1.2;" oninput="this.style.height=`auto`; this.style.height=this.scrollHeight+`px`;">' + pengalaman[i].tools + '</textarea></div>';
            }
        }
        $("#pengalaman").html(pengalamanHtml);

        var pelatihanHtml = "";
        for (var i in pelatihan) {
            if (pelatihan[i].instansi) {
                pelatihanHtml = ''
                    + ' <div class="title font-bold text-xl mb-1 mt-4">COURSE & TRAINING</div>'
                    + ' <hr class="border-2 border-gray-950" />';
            }
        }
        for (var i in pelatihan) {
            if (pelatihan[i].instansi) {
                pelatihanHtml += ''
                    + '  <div class="w-full flex">'
                    + '    <div class="font-bold"><input type="text" class="no-border auto-width" value="' + pelatihan[i].instansi + '"></div>'
                    + '    <div class="ms-auto font-bold"><input type="text" class="no-border auto-width" value="' + pelatihan[i].periode + '"></div>'
                    + '  </div>'
                    + '  <div class="me-2"><textarea rows="1" class="break-words border-0 overflow-hidden resize-none auto-height w-full" style="line-height: 1.2;" oninput="this.style.height=`auto`; this.style.height=this.scrollHeight+`px`;">' + pelatihan[i].program + '</textarea></div>';
            }
        }
        $("#pelatihan").html(pelatihanHtml);

        var sertifikatHtml = "";
        for (var i in sertifikat) {
            if (sertifikat[i].program) {
                sertifikatHtml = ''
                    + ' <div class="title font-bold text-xl mb-1 mt-4 text-center">CERTIFICATION</div>'
                    + ' <hr class="border-2 border-gray-950" />';
            }
        }
        for (var i in sertifikat) {
            if (sertifikat[i].program) {
                sertifikatHtml += ''
                    + '    <textarea rows="1" class="sub-title font-bold break-words border-0 overflow-hidden resize-none auto-height w-full" style="line-height: 1.2;" oninput="this.style.height=`auto`; this.style.height=this.scrollHeight+`px`;">' + sertifikat[i].program + '</textarea>'
                    + '    <textarea rows="1" class="text-sm break-words border-0 overflow-hidden resize-none auto-height w-full" style="line-height: 1.2;margin-top:-2px;display:block" oninput="this.style.height=`auto`; this.style.height=this.scrollHeight+`px`;">No. ' + sertifikat[i].no + '</textarea>'
                    + '    <input type="text" class="sub-title font-bold no-border auto-width" value="' + sertifikat[i].periode + '" style="display:block">'
            }
        }
        $("#sertifikat").html(sertifikatHtml);

        var juaraHtml = "";
        for (var i in juara) {
            if (juara[i].instansi) {
                juaraHtml = ''
                    + ' <div class="title font-bold text-xl mb-1 mt-6 text-center">AWARDS</div>'
                    + ' <hr class="border-2 border-gray-950 mb-1" />';
            }
        }
        for (var i in juara) {
            if (juara[i].instansi) {
                juaraHtml += ''
                    + '    <textarea rows="1" class="sub-title font-bold break-words border-0 overflow-hidden resize-none auto-height w-full" style="line-height: 1.2;" oninput="this.style.height=`auto`; this.style.height=this.scrollHeight+`px`;">' + juara[i].program + '</textarea>'
                    + '    <textarea rows="1" class="text-sm break-words border-0 overflow-hidden resize-none auto-height w-full" style="line-height: 1.2;display:block;margin-top:-2px" oninput="this.style.height=`auto`; this.style.height=this.scrollHeight+`px`;">' + juara[i].instansi + '</textarea>'
                    + '    <input type="text" class="sub-title font-bold no-border auto-width" value="' + juara[i].periode + '" style="display:block">';
            }
        }
        $("#juara").html(juaraHtml);

        var skillArr = [];
        var skillHtml = '<ul class="list-disc pl-5" style="line-height: 1.2;">';
        skillArr = skill.soft.split(", ");
        for (var i in skillArr) {
            skillHtml += '<li><input type="text" class="no-border auto-width" value="' + skillArr[i] + '"></li>';
        }
        skillArr += '</ul>';
        $("#soft").html(skillHtml);

        skillHtml = '<ul class="list-disc pl-5" style="line-height: 1.2;">';
        skillArr = skill.hard.split(", ");
        for (var i in skillArr) {
            skillHtml += '<li><input type="text" class="no-border auto-width" value="' + skillArr[i] + '"></li>';
        }
        skillArr += '</ul>';

        skillHtml = '<ul class="list-disc pl-5" style="line-height: 1.2;">';
        skillArr = skill.hard.split(", ");
        for (var i in skillArr) {
            skillHtml += '<li><input type="text" class="no-border auto-width" value="' + skillArr[i] + '"></li>';
        }
        skillArr += '</ul>';
        $("#hard").html(skillHtml);
        if (skill.bahasa) {
            skillHtml = '<ul class="list-disc pl-5" style="line-height: 1.2;">';
            skillArr = skill.bahasa.split(", ");
            for (var i in skillArr) {
                skillHtml += '<li><input type="text" class="no-border auto-width" value="' + skillArr[i] + '"></li>';
            }
            skillArr += '</ul>';
            $("#bahasa").html(skillHtml);
        }

        $("#printArea").removeClass("hidden");
        $("#btn-print").removeClass("hidden");
        $("#color").removeClass("hidden");

        widthInput();
        widthInput();
    }

    widthInput();

    function widthInput() {
        document.querySelectorAll('.auto-width').forEach(input => {
            const measure = document.createElement('span');

            measure.style.position = 'absolute';
            measure.style.visibility = 'hidden';
            measure.style.whiteSpace = 'pre';

            document.body.appendChild(measure);

            const updateWidth = () => {
                const styles = getComputedStyle(input);

                measure.style.font = styles.font;
                measure.style.letterSpacing = styles.letterSpacing;
                measure.textContent = input.value || input.placeholder || ' ';

                input.style.width = `${measure.offsetWidth + 8}px`;
            };

            input.addEventListener('input', updateWidth);
            updateWidth();
        });

        document.querySelectorAll('.auto-height').forEach(textarea => {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            textarea.addEventListener('input', () => {
                autoResize(textarea);
            });
        });
    }
</script>
