    <header class="bg-white py-3 shadow-md fixed top-0 w-full">

            <a href="https://rijukaze.github.io/site/" class="flex">

<script>
    const apiKey = "AIzaSyClTTJGBnoBQzHiIQh9_sZ2aEH0tIxrslo";
    const spreadsheetId = "1kkmYf47w6n0-QKWRQvE9sBh0K7xXJPaBK9DffyDxLHg";

    const url =
        `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/Shopee!B3:E?key=${apiKey}`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            let card = '';
            let no = 1;
            data.values.forEach(row => {
                console.log(row);
                card += '<div class="pb-4 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden flex flex-col h-full">'
                    + '<img src="' + row[2] + '" alt="Produk 1" class="w-full h-56 object-cover">'
                    + '<div class="p-4 pb-0">'
                    + '<h6 class="font-bold text-sm font-semibold text-gray-800">No ' + (no++) + '. ' + row[0] + '</h2>'
                    + '<p class="text-gray-600 mt-2 mb-4 text-xs">' + row[1] + '</p>'
                    + '</div>'
                    + '<div class="ps-4 pe-4 mt-auto">'
                    + '<a href="' + row[3] + '" target="_blank" class="block text-center bg-orange-500 text-white py-2 px-4 rounded">Link Shopee</a>'
                    + '</div>  </div>';
            });
            $("#list-menu").html(card);
        });

</script>

</html>
