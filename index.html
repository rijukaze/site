<script>
    const apiKey = "AIzaSyClTTJGBnoBQzHiIQh9_sZ2aEH0tIxrslo";
    const spreadsheetId = "1kkmYf47w6n0-QKWRQvE9sBh0K7xXJPaBK9DffyDxLHg";

    const url =
        `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/Home!B3:D?key=${apiKey}`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            let card = '';

                console.log(row);
                card += '<a href="' + row[2] + '" class=""><div class="bg-white p-5 text-center border border-lime-300 rounded-lg shadow-lg">' + row[1] + '<div class="mt-5 py-3 px-10 bg-lime-100 border border-lime-300 rounded-lg font-bold text-wite shadow">' + row[0] + '</div></div></a>';
            });
            $("#list-menu").html(card);
        });

</script>
